[project]
name = "dislearningqwen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"


dependencies = [    
    "torchdata>=0.8.0",
    "datasets>=2.21.0",
    "tokenizers>=0.22.1",
    "loguru>=0.7.3",
    "wandb>=0.23.1",
    "torch>=2.11.0,<2.12.0",
]


[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.14.10",
    "ty>=0.0.31",
    "vulture>=2.14",
    "pyright>=1.1.381"
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"] 

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pyright]
exclude = [".venv"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"